# =====================================================================
#  NovaBank - textes en francais
# =====================================================================
# Couleurs : &0-&9, &a-&f, styles &l &o &n &m &k, &r ; couleurs hexadecimales &#RRGGBB.
# Les {nom} sont remplaces par NovaBank. Une cle supprimee reprend le texte fourni.
# Vos textes ne sont jamais modifies : quand une mise a jour de NovaBank apporte de nouvelles
# cles, elles sont ajoutees a ce fichier au demarrage (ancien fichier sauvegarde dans
# lang/backup/, cles obsoletes signalees en console).

# Version de ce fichier. Geree par NovaBank : ne pas modifier.
lang-version: 10

# Format des nombres et des dates.
locale: fr-FR
date-format: "dd/MM/yyyy HH:mm"
prefix: "&b&lNovaBank &8» &r"

general:
  no-permission: "&cVous n'avez pas la permission d'utiliser cette commande."
  players-only: "&cCette commande est reservee aux joueurs."
  usage: "Utilisation : &f{usage}"
  unknown-subcommand: "&cSous-commande inconnue : {argument}. &rUtilisation : &f{usage}"
  invalid-quantity: "&cQuantite invalide : {value} (nombre entier positif ou 'all')."
  invalid-item: "&cItem invalide : {value}."
  invalid-page: "&cPage invalide : {value}."
  unknown-player: "&cJoueur inconnu : {player}."
  storage-error: "&cBase de donnees indisponible, reessayez plus tard."
  not-ready: "&eNovaBank n'est pas encore pret : reessayez dans un instant."

bank:
  description: "Banque de blocs NovaBank"
  clan-description: "Banque d'items du clan (NovaBank)"
  help:
    - "&bNovaBank &b- commandes :"
    - "&f/{label} deposit <item|hand|all> [quantite] &b: deposer des items"
    - "&f/{label} withdraw <item> <quantite|all> &b: retirer des items"
    - "&f/{label} info &b: banque active, valeur et stock"
    - "&f/{label} select <type> &b: choisir la banque active"
    - "&f/{label} top [type] &b: classement des banques"
    - "&f/{label} &bou &f/{label} open &b: ouvrir la banque (GUI)"
  help-scoped:
    - "&bNovaBank &b- commandes :"
    - "&f/{label} deposit <item|hand|all> [quantite] &b: deposer des items"
    - "&f/{label} withdraw <item> <quantite|all> &b: retirer des items"
    - "&f/{label} info &b: valeur et stock de la banque"
    - "&f/{label} top [type] &b: classement des banques"
    - "&f/{label} &bou &f/{label} open &b: ouvrir la banque (GUI)"
  deposit:
    success: "&aDepot de &f{quantity} {item}&a dans &f{bank}&a : &f+{value}&a (valeur : &f{total}&a)."
    returned: "&e{quantity} {item} rendus : {reason}"
    pending: "&e{quantity} {item} n'ont pas pu vous etre rendus (inventaire plein) : ils vous seront livres a votre prochaine connexion."
  withdraw:
    success: "&aRetrait de &f{quantity} {item}&a de &f{bank}&a : &f{value}&a (valeur : &f{total}&a)."
    pending: "&e{quantity} {item} n'ont pas pu etre remis (inventaire plein) : ils vous seront livres a votre prochaine connexion."
    returned: "&e{quantity} {item} n'ont pas pu etre remis (inventaire plein) et sont restes dans la banque."
    confirmation-pending: "&c{quantity} {item} remis, mais l'operation n'a pas pu etre confirmee. Un administrateur a ete prevenu."
  refusal:
    busy: "&cUne operation est deja en cours, patientez."
    cooldown: "&cPatientez encore {seconds} s avant une nouvelle operation."
    no-permission: "&cVous n'avez pas la permission de faire cette operation."
    no-bank: "&cVous n'avez acces a aucune banque."
    role-not-allowed: "&cVotre role ne vous permet pas cette operation dans la banque {bank}."
    not-accepted: "&cLa banque n'accepte pas {item}."
    nothing-in-hand: "&cVous ne tenez aucun item deposable en main (les items renommes, enchantes ou abimes sont refuses)."
    nothing-to-deposit: "&cVous n'avez aucun item deposable dans votre inventaire."
    quantity-limit: "&cAu plus {max} unites par operation."
    not-enough-items: "&cVous n'avez pas assez de {item} deposables (les items renommes, enchantes ou abimes sont refuses)."
    insufficient-stock: "&cStock insuffisant de {item} dans la banque {bank}."
    player-offline: "&cOperation annulee : vous vous etes deconnecte."
    shutting-down: "&cNovaBank s'arrete : operation impossible pour le moment, vos items sont en securite."
    maintenance: "&cNovaBank est en maintenance (migration des donnees) : operation impossible pour le moment, vos items sont en securite."
    storage-error: "&cBase de donnees indisponible : rien n'a ete enregistre, vos items vous ont ete rendus."
    refused: "&cOperation refusee par la banque ({reason})."
    internal-error: "&cErreur inattendue : contactez un administrateur."
  info:
    header: "&bBanque active : &f{bank} &b({type})"
    value: "&eValeur : &f{value}"
    stock-header: "&eStock :"
    stock-line: " &b- &f{item} &b: &f{quantity}"
    stock-empty: "&eLa banque est vide."
    others: "&eAutres banques : &f{banks} &b(/{label} select <type>)"
    no-bank: "&cVous n'avez acces a aucune banque."
  select:
    success: "&aBanque active : &f{bank} &b({type})"
    unknown-type: "&cType de banque inconnu : {type}. Types disponibles : {types}."
    not-member: "&cVous n'appartenez a aucune banque de type {type}."
  delivery:
    delivered: "&a{quantity} item(s) en attente vous ont ete livres."
    remaining: "&e{quantity} item(s) restent en attente (inventaire plein) : ils seront livres a votre prochaine connexion."

leaderboard:
  header: "&bClassement {type} &b(top {size})"
  line: "&e#{rank} &f{name} &b- &f{value}"
  line-self: "&e#{rank} {name} &b- &e{value} &b(vous)"
  self: "&eVotre rang : &f#{rank} &b({value})"
  unranked: "&eVotre banque n'est pas encore classee."
  empty: "&eAucune banque classee."
  disabled: "&cLes classements sont desactives."
  unknown-type: "&cClassement inconnu : {type}. Disponibles : {types}."

# GUI de banque (/bank). Placeholders des boutons : {bank} {value} {page} {pages}.
gui:
  title: "&8Banque : {bank}"
  no-room: "&cPlus de place dans votre inventaire pour {item}."
  stock:
    name: "&f{item}"
    lore:
      - "&bQuantite : &f{quantity}"
      - "&bValeur : &f{value}"
      - ""
      - "&eClic gauche &b: retirer une pile ({stack})"
      - "&eClic droit &b: retirer 1"
      - "&eMaj + clic &b: retirer tout ce qui tient"
  buttons:
    info:
      name: "&b{bank}"
      lore:
        - "&bValeur : &f{value}"
        - "&bPage &f{page}&b/&f{pages}"
        - ""
        - "&eClic &b: ce que rapporte chaque item"
    previous:
      name: "&bPage precedente"
      lore:
        - "&bPage &f{page}&b/&f{pages}"
    next:
      name: "&bPage suivante"
      lore:
        - "&bPage &f{page}&b/&f{pages}"
    deposit-all:
      name: "&aDeposer tout"
      lore:
        - "&bDepose tous les items acceptes"
        - "&bde votre inventaire."
    close:
      name: "&cFermer"
      lore: []
  # Liste des items acceptes et de leur prix (clic sur le bouton Information).
  prices:
    title: "&8Ce que rapporte chaque item"
    entry-name: "&f{item}"
    entry-lore:
      - "&bRapporte : &a{price} &bpar unite"
      - "&bCategorie : &f{category}"
    entry-lore-zero:
      - "&cNe rapporte rien pour le moment"
      - "&bCategorie : &f{category}"
    previous: "&bPage precedente"
    next: "&bPage suivante"
    back: "&eRetour a la banque"

# Accueil et aide de /novabank.
help:
  header: "&8&m        &r &b&lNovaBank &8&m        "
  author: "&eAuteur &8» &f{author}"
  version: "&eVersion &8» &f{version}"
  description:
    - "&eDescription &8» &bBanque virtuelle de blocs : deposez vos items acceptes, retirez-les quand vous voulez,"
    - "&bet cumulez une valeur pour votre banque, celle de votre ile, ville ou clan. Classements et menu simple inclus."
  discord: "&eDiscord &8» &b{url}"
  github: "&eGitHub &8» &b{url}"
  commands-title: "&b&lCommandes &8(&ecliquez pour pre-remplir&8)"
  line: "&b{command} &8» &e{description}"
  hover: "&eCliquez pour pre-remplir &b{command}"
  hover-link: "&eCliquez pour ouvrir le lien"
  desc:
    open: "Ouvrir votre banque"
    deposit: "Deposer des items"
    withdraw: "Retirer des items"
    info: "Banque active, valeur et stock"
    select: "Choisir la banque active"
    top: "Classement des banques"
    help: "Afficher cette aide"
    hub: "Menu d'administration"
    diagnostic: "Etat du plugin et du stockage"
    reload: "Recharger config.yml"
    bank: "Voir la banque d'un joueur"
    history: "Historique des operations d'un joueur"
    reset: "Reinitialiser la valeur d'une banque"
    transfer: "Transferer le stock d'une banque a une autre"
    resync: "Recalculer le niveau de toutes les iles"
    discord: "Envoyer un message d'essai dans le salon Discord"
    migrate: "Migrer le stockage vers un autre type"
    config: "Lire ou modifier la configuration"
    gui: "Editeur visuel du GUI"
    items: "Editeur des items et des prix"

# Editeurs en jeu (/novabank gui, /novabank items).
editor:
  gui:
    title: "&8NovaBank - editeur de GUI"
    selected: " &a(en main)"
    button-name: "&e{button}{selected}"
    button-lore:
      - "&bCase : &f{slot}"
      - "&eClic gauche&b : prendre, puis poser"
      - "&eClic droit&b : icone = objet tenu en main"
    stock-name: "&bZone de stock"
    stock-lore:
      - "&bLes items de la banque s'affichent"
      - "&bici, autour des boutons."
    free-name: "&eCase libre"
    free-lore:
      - "&eClic gauche&b : poser le bouton ici"
    buttons:
      info: "Information"
      previous: "Page precedente"
      deposit-all: "Tout deposer"
      next: "Page suivante"
      close: "Fermer"
  items:
    title: "&8NovaBank - items acceptes ({page}/{pages})"
    entry-name: "&f{item}"
    entry-lore:
      - "&bPrix : &f{price}"
      - "&bCategorie : &f{category}"
      - ""
      - "&eClic&b : modifier le prix"
      - "&eMajuscule + clic&b : retirer de la liste"
    previous: "&bPage precedente"
    next: "&bPage suivante"
    info-name: "&bBrouillon"
    info-clean: "&e{count} items, identique au fichier"
    info-dirty: "&e{count} items\n&cModifie, pas encore enregistre\n&b/novabank items save"
    add-name: "&aAjouter un item"
    add-lore:
      - "&bCliquez sur un item de votre inventaire"
      - "&bpour l'ajouter (prix 1, a ajuster ensuite)"
      - "&bou tenez-le en main puis cliquez ici"
  confirm:
    title: "&8NovaBank - confirmation"
    cancel: "&c&lANNULER"
    confirm: "&a&lCONFIRMER"
  price:
    title: "&8NovaBank - fiche de l'item"
    minus: "&c-{amount}"
    plus: "&a+{amount}"
    item-name: "&e{item}"
    item-lore:
      - "&bPrix actuel : &f{price}"
      - "&bCategorie : &f{category}"
      - "&7{id}"
    type-name: "&eSaisir le prix"
    type-lore:
      - "&bTapez le prix dans le chat"
      - "&b(&eannuler&b pour abandonner)"
    category-name: "&eChanger la categorie"
    category-lore:
      - "&bActuelle : &f{category}"
      - "&bTapez-la dans le chat (&e-&b pour la retirer)"
    name-name: "&eChanger le nom affiche"
    name-lore:
      - "&bActuel : &f{name}"
      - "&bTapez-le dans le chat (&e-&b pour le retirer)"
    delete-name: "&cSupprimer l'item"
    delete-lore:
      - "&cRetire l'item de la liste"
    back: "&bRetour a la liste"
  hub:
    title: "&8NovaBank - administration"
    state-clean: "&aA jour"
    state-dirty: "&cModifie, pas encore enregistre"
    items:
      name: "&bItems et prix"
      lore:
        - "&b{count} items acceptes"
        - "{state}"
        - "&eClic&b : ouvrir l'editeur"
    gui:
      name: "&bDisposition du GUI"
      lore:
        - "&b{rows} lignes"
        - "{state}"
        - "&eClic&b : ouvrir l'editeur visuel"
    rows:
      name: "&eLignes du GUI : &f{rows}"
      lore:
        - "&eClic gauche&b : +1   &eClic droit&b : -1"
    reset:
      name: "&eDisposition par defaut"
      lore:
        - "&bRemet les boutons a leur place d'origine"
        - "&b(dans le brouillon, pas encore enregistre)"
    save:
      name: "&aEnregistrer et deployer"
      lore:
        - "&bSauvegarde config.yml dans backup/, valide,"
        - "&bapplique ici puis envoie aux autres serveurs"
    save-nothing:
      name: "&eEnregistrer"
      lore:
        - "&bRien a enregistrer"
    cancel:
      name: "&cAbandonner les changements"
      lore:
        - "&bEfface les brouillons non enregistres"
    cancel-nothing:
      name: "&eAbandonner"
      lore:
        - "&bAucun brouillon"
    push:
      name: "&bRenvoyer aux autres serveurs"
      lore:
        - "&bEnvoie la configuration actuelle par Redis"
        - "&b(rattrape un serveur reste a l'ecart)"
    reload:
      name: "&bRecharger config.yml"
      lore:
        - "&bRelit le fichier sur ce serveur"
    settings:
      name: "&bParametres"
      lore:
        - "&bTous les autres reglages de config.yml"
        - "{state}"
        - "&eClic&b : ouvrir"

