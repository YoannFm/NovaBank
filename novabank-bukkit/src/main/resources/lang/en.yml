# =====================================================================
#  NovaBank - English texts
# =====================================================================
# Colors: &0-&9, &a-&f, styles &l &o &n &m &k, &r; hexadecimal colors &#RRGGBB.
# {name} placeholders are filled in by NovaBank. A removed key falls back to the bundled text.
# Your texts are never modified: when a NovaBank update brings new keys, they are added
# to this file at startup (previous file backed up in lang/backup/, obsolete keys reported
# in the console).

# Version of this file. Managed by NovaBank: do not edit.
lang-version: 10

# Number and date format.
locale: en-US
date-format: "yyyy-MM-dd HH:mm"
prefix: "&b&lNovaBank &8» &r"

general:
  no-permission: "&cYou do not have permission to use this command."
  players-only: "&cThis command can only be used by players."
  usage: "Usage: &f{usage}"
  unknown-subcommand: "&cUnknown subcommand: {argument}. &rUsage: &f{usage}"
  invalid-quantity: "&cInvalid quantity: {value} (positive whole number or 'all')."
  invalid-item: "&cInvalid item: {value}."
  invalid-page: "&cInvalid page: {value}."
  unknown-player: "&cUnknown player: {player}."
  storage-error: "&cDatabase unavailable, please try again later."
  not-ready: "&eNovaBank is not ready yet: try again in a moment."

bank:
  description: "NovaBank block bank"
  clan-description: "Clan item bank (NovaBank)"
  help:
    - "&bNovaBank &b- commands:"
    - "&f/{label} deposit <item|hand|all> [amount] &b: deposit items"
    - "&f/{label} withdraw <item> <amount|all> &b: withdraw items"
    - "&f/{label} info &b: active bank, value and stock"
    - "&f/{label} select <type> &b: choose the active bank"
    - "&f/{label} top [type] &b: bank leaderboard"
    - "&f/{label} &bor &f/{label} open &b: open the bank (GUI)"
  help-scoped:
    - "&bNovaBank &b- commands:"
    - "&f/{label} deposit <item|hand|all> [amount] &b: deposit items"
    - "&f/{label} withdraw <item> <amount|all> &b: withdraw items"
    - "&f/{label} info &b: bank value and stock"
    - "&f/{label} top [type] &b: bank leaderboard"
    - "&f/{label} &bor &f/{label} open &b: open the bank (GUI)"
  deposit:
    success: "&aDeposited &f{quantity} {item}&a into &f{bank}&a: &f+{value}&a (value: &f{total}&a)."
    returned: "&e{quantity} {item} returned: {reason}"
    pending: "&e{quantity} {item} could not be returned (inventory full): they will be delivered at your next login."
  withdraw:
    success: "&aWithdrew &f{quantity} {item}&a from &f{bank}&a: &f{value}&a (value: &f{total}&a)."
    pending: "&e{quantity} {item} could not be given (inventory full): they will be delivered at your next login."
    returned: "&e{quantity} {item} could not be given (inventory full) and stayed in the bank."
    confirmation-pending: "&c{quantity} {item} given, but the operation could not be confirmed. An administrator has been notified."
  refusal:
    busy: "&cAn operation is already in progress, please wait."
    cooldown: "&cPlease wait {seconds} s before another operation."
    no-permission: "&cYou do not have permission for this operation."
    no-bank: "&cYou do not have access to any bank."
    role-not-allowed: "&cYour role does not allow this operation in the bank {bank}."
    not-accepted: "&cThe bank does not accept {item}."
    nothing-in-hand: "&cYou are not holding a depositable item (renamed, enchanted or damaged items are refused)."
    nothing-to-deposit: "&cYou have no depositable item in your inventory."
    quantity-limit: "&cAt most {max} units per operation."
    not-enough-items: "&cYou do not have enough depositable {item} (renamed, enchanted or damaged items are refused)."
    insufficient-stock: "&cNot enough {item} in the bank {bank}."
    player-offline: "&cOperation cancelled: you logged out."
    shutting-down: "&cNovaBank is stopping: operation unavailable for now, your items are safe."
    maintenance: "&cNovaBank is under maintenance (data migration): operation unavailable for now, your items are safe."
    storage-error: "&cDatabase unavailable: nothing was recorded, your items were given back."
    refused: "&cOperation refused by the bank ({reason})."
    internal-error: "&cUnexpected error: please contact an administrator."
  info:
    header: "&bActive bank: &f{bank} &b({type})"
    value: "&eValue: &f{value}"
    stock-header: "&eStock:"
    stock-line: " &b- &f{item} &b: &f{quantity}"
    stock-empty: "&eThe bank is empty."
    others: "&eOther banks: &f{banks} &b(/{label} select <type>)"
    no-bank: "&cYou do not have access to any bank."
  select:
    success: "&aActive bank: &f{bank} &b({type})"
    unknown-type: "&cUnknown bank type: {type}. Available types: {types}."
    not-member: "&cYou do not belong to any bank of type {type}."
  delivery:
    delivered: "&a{quantity} pending item(s) have been delivered to you."
    remaining: "&e{quantity} item(s) are still pending (inventory full): they will be delivered at your next login."

leaderboard:
  header: "&b{type} leaderboard &b(top {size})"
  line: "&e#{rank} &f{name} &b- &f{value}"
  line-self: "&e#{rank} {name} &b- &e{value} &b(you)"
  self: "&eYour rank: &f#{rank} &b({value})"
  unranked: "&eYour bank is not ranked yet."
  empty: "&eNo ranked bank."
  disabled: "&cLeaderboards are disabled."
  unknown-type: "&cUnknown leaderboard: {type}. Available: {types}."

# Bank GUI (/bank). Button placeholders: {bank} {value} {page} {pages}.
gui:
  title: "&8Bank: {bank}"
  no-room: "&cNo room left in your inventory for {item}."
  stock:
    name: "&f{item}"
    lore:
      - "&bQuantity: &f{quantity}"
      - "&bValue: &f{value}"
      - ""
      - "&eLeft click &b: withdraw one stack ({stack})"
      - "&eRight click &b: withdraw 1"
      - "&eShift + click &b: withdraw all that fits"
  buttons:
    info:
      name: "&b{bank}"
      lore:
        - "&bValue: &f{value}"
        - "&bPage &f{page}&b/&f{pages}"
        - ""
        - "&eClick&b: what each item is worth"
    previous:
      name: "&bPrevious page"
      lore:
        - "&bPage &f{page}&b/&f{pages}"
    next:
      name: "&bNext page"
      lore:
        - "&bPage &f{page}&b/&f{pages}"
    deposit-all:
      name: "&aDeposit all"
      lore:
        - "&bDeposits every accepted item"
        - "&bfrom your inventory."
    close:
      name: "&cClose"
      lore: []
  # Accepted items and their price (click on the Information button).
  prices:
    title: "&8What each item is worth"
    entry-name: "&f{item}"
    entry-lore:
      - "&bWorth: &a{price} &bper unit"
      - "&bCategory: &f{category}"
    entry-lore-zero:
      - "&cWorth nothing for now"
      - "&bCategory: &f{category}"
    previous: "&bPrevious page"
    next: "&bNext page"
    back: "&eBack to the bank"

# Welcome message and help of /novabank.
help:
  header: "&8&m        &r &b&lNovaBank &8&m        "
  author: "&eAuthor &8» &f{author}"
  version: "&eVersion &8» &f{version}"
  description:
    - "&eDescription &8» &bVirtual block bank: deposit accepted items, withdraw them whenever you like,"
    - "&band build up value for your bank, your island's, town's or clan's. Leaderboards and a simple menu included."
  discord: "&eDiscord &8» &b{url}"
  github: "&eGitHub &8» &b{url}"
  commands-title: "&b&lCommands &8(&eclick to pre-fill&8)"
  line: "&b{command} &8» &e{description}"
  hover: "&eClick to pre-fill &b{command}"
  hover-link: "&eClick to open the link"
  desc:
    open: "Open your bank"
    deposit: "Deposit items"
    withdraw: "Withdraw items"
    info: "Active bank, value and stock"
    select: "Choose the active bank"
    top: "Bank leaderboard"
    help: "Show this help"
    hub: "Administration menu"
    diagnostic: "Plugin and storage status"
    reload: "Reload config.yml"
    bank: "View a player's bank"
    history: "A player's operation history"
    reset: "Reset a bank's value"
    transfer: "Move one bank's stock to another"
    resync: "Recompute the level of every island"
    discord: "Send a test message to the Discord channel"
    migrate: "Migrate storage to another type"
    config: "Read or change the configuration"
    gui: "Visual GUI editor"
    items: "Items and prices editor"

# In-game editors (/novabank gui, /novabank items).
editor:
  gui:
    title: "&8NovaBank - GUI editor"
    selected: " &a(in hand)"
    button-name: "&e{button}{selected}"
    button-lore:
      - "&bSlot: &f{slot}"
      - "&eLeft click&b: pick up, then drop"
      - "&eRight click&b: icon = item held in hand"
    stock-name: "&bStock area"
    stock-lore:
      - "&bThe bank's items are shown"
      - "&bhere, around the buttons."
    free-name: "&eFree slot"
    free-lore:
      - "&eLeft click&b: drop the button here"
    buttons:
      info: "Information"
      previous: "Previous page"
      deposit-all: "Deposit all"
      next: "Next page"
      close: "Close"
  items:
    title: "&8NovaBank - accepted items ({page}/{pages})"
    entry-name: "&f{item}"
    entry-lore:
      - "&bPrice: &f{price}"
      - "&bCategory: &f{category}"
      - ""
      - "&eClick&b: edit the price"
      - "&eShift + click&b: remove from the list"
    previous: "&bPrevious page"
    next: "&bNext page"
    info-name: "&bDraft"
    info-clean: "&e{count} items, same as the file"
    info-dirty: "&e{count} items\n&cModified, not saved yet\n&b/novabank items save"
    add-name: "&aAdd an item"
    add-lore:
      - "&bClick an item in your inventory"
      - "&bto add it (price 1, adjust afterwards)"
      - "&bor hold it and click here"
  confirm:
    title: "&8NovaBank - confirmation"
    cancel: "&c&lCANCEL"
    confirm: "&a&lCONFIRM"
  price:
    title: "&8NovaBank - item sheet"
    minus: "&c-{amount}"
    plus: "&a+{amount}"
    item-name: "&e{item}"
    item-lore:
      - "&bCurrent price: &f{price}"
      - "&bCategory: &f{category}"
      - "&7{id}"
    type-name: "&eType the price"
    type-lore:
      - "&bType the price in chat"
      - "&b(&ecancel&b to abort)"
    category-name: "&eChange the category"
    category-lore:
      - "&bCurrent: &f{category}"
      - "&bType it in chat (&e-&b to remove it)"
    name-name: "&eChange the display name"
    name-lore:
      - "&bCurrent: &f{name}"
      - "&bType it in chat (&e-&b to remove it)"
    delete-name: "&cRemove the item"
    delete-lore:
      - "&cRemoves the item from the list"
    back: "&bBack to the list"
  hub:
    title: "&8NovaBank - administration"
    state-clean: "&aUp to date"
    state-dirty: "&cModified, not saved yet"
    items:
      name: "&bItems and prices"
      lore:
        - "&b{count} accepted items"
        - "{state}"
        - "&eClick&b: open the editor"
    gui:
      name: "&bGUI layout"
      lore:
        - "&b{rows} rows"
        - "{state}"
        - "&eClick&b: open the visual editor"
    rows:
      name: "&eGUI rows: &f{rows}"
      lore:
        - "&eLeft click&b: +1   &eRight click&b: -1"
    reset:
      name: "&eDefault layout"
      lore:
        - "&bPuts the buttons back in their original place"
        - "&b(in the draft, not saved yet)"
    save:
      name: "&aSave and deploy"
      lore:
        - "&bBacks up config.yml in backup/, validates,"
        - "&bapplies here then sends to the other servers"
    save-nothing:
      name: "&eSave"
      lore:
        - "&bNothing to save"
    cancel:
      name: "&cDiscard changes"
      lore:
        - "&bClears the unsaved drafts"
    cancel-nothing:
      name: "&eDiscard"
      lore:
        - "&bNo draft"
    push:
      name: "&bSend to the other servers"
      lore:
        - "&bSends the current configuration through Redis"
        - "&b(catches up a server that missed a change)"
    reload:
      name: "&bReload config.yml"
      lore:
        - "&bRereads the file on this server"
    settings:
      name: "&bSettings"
      lore:
        - "&bAll other config.yml settings"
        - "{state}"
        - "&eClick&b: open"

