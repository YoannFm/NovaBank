# Publishes a GitHub release when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0).
# The release gets the standalone JAR and the 8 extension JARs; attach the documentation PDF by hand afterwards.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and unit tests
        run: mvn -B install
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            novabank-plugin/target/NovaBank-*.jar
            novabank-editions/target/editions/NovaBank-*.jar
            novabank-api/target/novabank-api-*.jar
            LICENSE
